name: build driver (Linux Steam client relay)

# The DirectAudio driver for a glibc Wine: Valve's own ARM64 Proton (and the
# GE / CachyOS builds of it) as the Linux Steam client runs it on Android inside
# a proot runtime (DroidDeck, Bannerlator's Linux session). Three products:
#
#   unixlib  winedirectaudio.so (aarch64 glibc, -DDA_RELAY: NO AAudio) plus the
#            arm64ec + i386 PE shells - ONE SET PER mmdevapi ABI, because the
#            private dlls/mmdevapi/unixlib.h call table is not versioned and a
#            mismatch is silence, not an error:
#              linux-wine11            ValveSoftware/wine @ proton_11.0 - serves
#                                      Proton 11.0, Proton Experimental,
#                                      bleeding-edge and GE-Proton 11.x (their
#                                      unixlib.h is byte-identical, checked
#                                      2026-10-08)
#              linux-wine11-systhread  CachyOS/wine-cachyos at the commit of
#                                      proton-cachyos 11.0-20261005-slr: upstream
#                                      Wine's system-thread mmdevapi
#                                      (main_loop_start/stop, no timer_loop) -
#                                      also what 11.0-20260703-slr carries
#   relay    directaudio-relay (aarch64 bionic, API 28, 16 KB-page safe): the
#            helper that owns every AAudio stream on the Android side, ABI-free.
#   sink     module-directaudio-sink.so: a PulseAudio 13 sink that feeds the
#            relay's ring, so the Steam client's own sound shares the device
#            stream with the games.
#
# The unixlib is CROSS-compiled from x86_64 exactly the way the bionic build is:
# native wine-tools first, then a --host=aarch64-linux-gnu configure of the same
# tree with the PE side on llvm-mingw. Only the driver's own targets are made.
#
# Provenance rule, same as ci.yml: a green build proves the artifact compiled
# and links against the declared libraries and nothing else; the readelf step
# below is what enforces "no AAudio in the game process". On-device audio is
# verified separately.

on:
  push:
    branches: [ main, 'feat/linux-*' ]
    tags: [ 'directaudio-linux-v*' ]
  pull_request:
  workflow_dispatch:

env:
  LLVM_MINGW: llvm-mingw-20250920-ucrt-ubuntu-22.04-x86_64
  # The two mmdevapi call tables this build knows. The checkout is refused when a
  # tree's header does not hash to the table its leg claims, so a silent mismatch
  # can never ship under a known label.
  UNIXLIB_SHA_WINE11: fdbed263338d0719c4d12e02b045c23721de33219ec8878e4c2d7ebc9efcbe09
  UNIXLIB_SHA_SYSTHREAD: 0de9fde40d091d82

jobs:
  unixlib:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-wine11
            abi: wine11
            wine_repo: ValveSoftware/wine
            wine_ref: proton_11.0
            extradefs: ""
          - label: linux-wine11-systhread
            abi: systhread
            wine_repo: CachyOS/wine-cachyos
            wine_ref: 2ce6b44caa66a56ec99c7826ae564c088abc1b9f
            extradefs: "-DWINE_MMDEVAPI_SYSTEM_THREADS"
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h | head -2

      - name: Checkout the Wine tree (${{ matrix.wine_repo }} @ ${{ matrix.wine_ref }})
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.wine_repo }}
          ref: ${{ matrix.wine_ref }}
          path: wine
          fetch-depth: 1

      - name: Checkout this driver (source under test)
        uses: actions/checkout@v4
        with:
          path: driver

      - name: Overlay the driver into the Wine tree
        run: |
          set -e
          mkdir -p wine/dlls/winedirectaudio.drv
          cp -v driver/directaudio.c driver/da_relay_proto.h driver/da_aaudio_compat.h wine/dlls/winedirectaudio.drv/
          cp -v driver/Makefile.relay.in wine/dlls/winedirectaudio.drv/Makefile.in
          if [ -n "${{ matrix.extradefs }}" ]; then
            sed -i 's|^EXTRADEFS = -DDA_RELAY$|EXTRADEFS = -DDA_RELAY ${{ matrix.extradefs }}|' wine/dlls/winedirectaudio.drv/Makefile.in
          fi
          grep -n '^EXTRADEFS' wine/dlls/winedirectaudio.drv/Makefile.in
          # Register the module with configure. These trees have no directaudio
          # integration (upstream Wine plus Proton); the only line the relay build
          # needs is the makefile registration - no AAudio probe, no mmdevapi
          # driver-list change (the driver is selected by registry).
          grep -q 'WINE_CONFIG_MAKEFILE(dlls/winedirectaudio.drv)' wine/configure.ac || \
            sed -i 's|^WINE_CONFIG_MAKEFILE(dlls/winepulse.drv)$|WINE_CONFIG_MAKEFILE(dlls/winedirectaudio.drv)\nWINE_CONFIG_MAKEFILE(dlls/winepulse.drv)|' wine/configure.ac
          grep -n 'winedirectaudio' wine/configure.ac
          echo "--- ABI header this build compiles against ---"
          sha256sum wine/dlls/mmdevapi/unixlib.h
          SHA=$(sha256sum wine/dlls/mmdevapi/unixlib.h | cut -c1-64)
          case "${{ matrix.abi }}" in
            wine11)
              test "$SHA" = "$UNIXLIB_SHA_WINE11"
              grep -q 'struct timer_loop_params' wine/dlls/mmdevapi/unixlib.h ;;
            systhread)
              test "${SHA:0:16}" = "$UNIXLIB_SHA_SYSTHREAD"
              grep -q 'create_unix_thread' wine/dlls/mmdevapi/unixlib.h
              ! grep -q 'struct timer_loop_params' wine/dlls/mmdevapi/unixlib.h ;;
          esac
          echo "OK: ${{ matrix.label }} is the ${{ matrix.abi }} mmdevapi table"
          ls -la wine/dlls/winedirectaudio.drv/

      - name: Set up build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git wget curl unzip flex bison gettext autoconf \
            pkg-config ccache gcc-aarch64-linux-gnu libc6-dev-arm64-cross \
            binutils-aarch64-linux-gnu

      - name: Cache LLVM MinGW toolchain
        id: cache-llvm-mingw
        uses: actions/cache@v4
        with:
          path: ~/toolchains/${{ env.LLVM_MINGW }}
          key: bylaws-llvm-mingw-20250920
      - name: Set up LLVM MinGW toolchain
        if: steps.cache-llvm-mingw.outputs.cache-hit != 'true'
        run: |
          mkdir -p $HOME/toolchains && cd $HOME/toolchains
          wget -q https://github.com/bylaws/llvm-mingw/releases/download/20250920/${{ env.LLVM_MINGW }}.tar.xz
          tar -xf ${{ env.LLVM_MINGW }}.tar.xz

      - name: Generate Wine's derived sources + autoreconf
        working-directory: wine
        run: |
          set -e
          # Valve-derived trees do not commit make_vulkan's output (include/wine/vulkan.h,
          # the winevulkan thunks); makedep then refuses to generate any Makefile.
          # Proton's own build runs exactly this first (make/rules-wine.mk).
          python3 dlls/winevulkan/make_vulkan -x vk.xml -X video.xml
          tools/make_specfiles || true
          # The committed include/wine/server_protocol.h lags server/protocol.def
          # in these trees (Proton regenerates it); the unixlib links against
          # ntdll.so, whose build needs the two to agree.
          tools/make_requests
          test -f include/wine/vulkan.h
          autoreconf -f

      - name: Cache wine-tools
        id: cache-wine-tools
        uses: actions/cache@v4
        with:
          path: wine/wine-tools
          key: wine-tools-linux-${{ matrix.label }}-${{ hashFiles('wine/configure.ac') }}
      - name: Build wine-tools (native)
        if: steps.cache-wine-tools.outputs.cache-hit != 'true'
        working-directory: wine
        run: |
          set -e
          mkdir -p wine-tools && cd wine-tools
          # --enable-win64: a plain x86_64 configure defaults to a 32-bit build and
          # demands i386 development libraries the runner does not have.
          ../configure --enable-win64 --without-x --without-freetype --without-gstreamer \
                       --without-vulkan --without-wayland --without-mingw --disable-tests
          make -j"$(nproc)" __tooldeps__ nls/all

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-da-${{ matrix.label }}-${{ github.sha }}
          restore-keys: |
            ccache-da-${{ matrix.label }}-

      - name: Configure (aarch64 glibc unix side, llvm-mingw PE side)
        working-directory: wine
        shell: bash
        run: |
          set -eo pipefail
          export PATH="$HOME/toolchains/${{ env.LLVM_MINGW }}/bin:$PATH"
          export CCACHE_DIR="$HOME/.ccache"
          ccache -M 2G >/dev/null || true
          export CC="ccache aarch64-linux-gnu-gcc"
          export CFLAGS="-g0 -O2"
          export CROSSCFLAGS="-g0 -O2"
          ./configure \
            --host=aarch64-linux-gnu --build=x86_64-linux-gnu \
            --with-wine-tools=wine-tools \
            --enable-archs=arm64ec,aarch64,i386 \
            --with-mingw=clang \
            --enable-win64 --disable-win16 --disable-tests \
            --without-alsa --without-capi --without-coreaudio --without-cups \
            --without-dbus --without-ffmpeg --without-fontconfig --without-freetype \
            --without-gcrypt --without-gettext --with-gettextpo=no --without-gphoto \
            --without-gnutls --without-gssapi --without-gstreamer --without-inotify \
            --without-krb5 --without-netapi --without-opencl --without-opengl \
            --without-oss --without-pcap --without-pcsclite --without-pulse \
            --without-sane --without-sdl --without-udev --without-unwind \
            --without-usb --without-v4l2 --without-vulkan --without-wayland \
            --without-xcomposite --without-xcursor --without-xfixes --without-xinerama \
            --without-xinput --without-xinput2 --without-xrandr --without-xrender \
            --without-xshape --without-xshm --without-xxf86vm --without-x
          echo "--- configure summary: audio drivers ---"
          grep -E '^(enable_winedirectaudio_drv|enable_winepulse_drv|enable_winealsa_drv)' config.log || true

      - name: Build ONLY the DirectAudio driver
        working-directory: wine
        shell: bash
        run: |
          set -eo pipefail
          export PATH="$HOME/toolchains/${{ env.LLVM_MINGW }}/bin:$PATH"
          export CCACHE_DIR="$HOME/.ccache"
          mapfile -t TGTS < <(grep -oE "dlls/winedirectaudio\.drv/([A-Za-z0-9_-]+-windows/winedirectaudio\.drv|winedirectaudio\.so)" Makefile | sort -u)
          echo "discovered targets:"; printf '  %s\n' "${TGTS[@]}"
          test "${#TGTS[@]}" -ge 2
          echo "::group::make driver"
          make -j"$(nproc)" "${TGTS[@]}"
          echo "::endgroup::"
          find dlls/winedirectaudio.drv -name 'winedirectaudio.*' ! -name '*.c' -exec ls -la {} +

      - name: Collect, strip and VERIFY the artifact
        working-directory: wine
        shell: bash
        run: |
          set -eo pipefail
          OUT="$GITHUB_WORKSPACE/out/${{ matrix.label }}"
          mkdir -p "$OUT/aarch64-windows" "$OUT/i386-windows" "$OUT/aarch64-unix"
          PE64=$(find . -type f -path '*/aarch64-windows/winedirectaudio.drv' | head -1)
          PE32=$(find . -type f -path '*/i386-windows/winedirectaudio.drv'    | head -1)
          SO=$(find . -type f -name 'winedirectaudio.so' | head -1)
          echo "PE64=$PE64"; echo "PE32=$PE32"; echo "SO=$SO"
          test -n "$PE64" && test -n "$PE32" && test -n "$SO"
          cp -v "$PE64" "$OUT/aarch64-windows/winedirectaudio.drv"
          cp -v "$PE32" "$OUT/i386-windows/winedirectaudio.drv"
          cp -v "$SO"   "$OUT/aarch64-unix/winedirectaudio.so"
          STRIP="$HOME/toolchains/${{ env.LLVM_MINGW }}/bin/llvm-strip"
          "$STRIP" --strip-all "$OUT/aarch64-windows/winedirectaudio.drv" || true
          "$STRIP" --strip-all "$OUT/i386-windows/winedirectaudio.drv"    || true
          aarch64-linux-gnu-strip --strip-unneeded "$OUT/aarch64-unix/winedirectaudio.so"
          echo "--- artifact ---"
          find "$OUT" -type f -exec ls -la {} + ; find "$OUT" -type f -exec file {} +
          echo "--- unixlib linkage (must be glibc, must NOT mention AAudio) ---"
          aarch64-linux-gnu-readelf -d "$OUT/aarch64-unix/winedirectaudio.so" | grep -E 'NEEDED|SONAME'
          aarch64-linux-gnu-readelf -d "$OUT/aarch64-unix/winedirectaudio.so" | grep -q 'libc\.so\.6'
          ! aarch64-linux-gnu-readelf -d "$OUT/aarch64-unix/winedirectaudio.so" | grep -qi 'aaudio'
          ! aarch64-linux-gnu-nm -D -u "$OUT/aarch64-unix/winedirectaudio.so" | grep -qi 'aaudio'
          ! grep -aq 'libaaudio' "$OUT/aarch64-unix/winedirectaudio.so"
          echo "OK: glibc unixlib, AAudio-free"
          if [ "${{ matrix.abi }}" = "systhread" ]; then
            # The system-thread table makes the driver spawn its own timer thread.
            aarch64-linux-gnu-nm -D -u "$OUT/aarch64-unix/winedirectaudio.so" | grep -q 'PsCreateSystemThread'
            echo "OK: system-thread build (imports PsCreateSystemThread)"
          else
            ! aarch64-linux-gnu-nm -D -u "$OUT/aarch64-unix/winedirectaudio.so" | grep -q 'PsCreateSystemThread'
            echo "OK: classic Wine 11 build (no PsCreateSystemThread)"
          fi
          cp -v "$GITHUB_WORKSPACE/driver/docs/linux-relay/INSTALL.md" "$OUT/README.md" 2>/dev/null || true
          printf 'directaudio %s relay build\nabi %s\nsource %s\nwine %s@%s\nunixlib.h sha256 %s\n' \
            "${{ matrix.label }}" "${{ matrix.abi }}" "${{ github.sha }}" "${{ matrix.wine_repo }}" "${{ matrix.wine_ref }}" \
            "$(sha256sum dlls/mmdevapi/unixlib.h | cut -c1-64)" > "$OUT/version.txt"
          cat "$OUT/version.txt"

      - name: Upload unixlib artifact
        uses: actions/upload-artifact@v4
        with:
          name: directaudio-${{ matrix.label }}
          path: out/${{ matrix.label }}
          retention-days: 30

  relay:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout this driver
        uses: actions/checkout@v4

      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: ~/Android/Sdk/ndk/27.3.13750724
          key: android-ndk-r27d
      - name: Set up Android NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          mkdir -p $HOME/Android/Sdk/ndk && cd $HOME/Android/Sdk/ndk
          wget -q https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
          unzip -q android-ndk-r27d-linux.zip
          mv android-ndk-r27d 27.3.13750724

      - name: Build the relay helper (bionic, API 28, 16 KB-page safe)
        shell: bash
        run: |
          set -eo pipefail
          TC="$HOME/Android/Sdk/ndk/27.3.13750724/toolchains/llvm/prebuilt/linux-x86_64/bin"
          OUT="$GITHUB_WORKSPACE/out/relay"
          mkdir -p "$OUT"
          # One binary for every device: API 28 is the driver's floor, and a
          # 16 KB max-page-size executable loads on 4 KB and 16 KB kernels alike.
          "$TC/aarch64-linux-android28-clang" -O2 -Wall -Wextra -Wno-unused-parameter -Wno-sign-compare \
            -fPIE -pie -Wl,-z,max-page-size=16384 -Wl,-z,now \
            directaudio-relay.c -o "$OUT/directaudio-relay" -laaudio -llog -pthread
          "$TC/llvm-strip" --strip-all "$OUT/directaudio-relay"
          # The same binary under the name an Android app's jniLibs/ wants.
          cp "$OUT/directaudio-relay" "$OUT/libdirectaudiorelay.so"
          ls -la "$OUT"; file "$OUT/directaudio-relay"
          echo "--- helper linkage (MUST carry libaaudio: it is the whole point) ---"
          "$TC/llvm-readelf" -d "$OUT/directaudio-relay" | grep -E 'NEEDED'
          "$TC/llvm-readelf" -d "$OUT/directaudio-relay" | grep -q 'libaaudio\.so'
          "$TC/llvm-readelf" -l "$OUT/directaudio-relay" | grep -E 'LOAD' | head -2
          echo "OK: bionic helper with AAudio"
          printf 'directaudio-relay\nsource %s\nprotocol v%s\n' "${{ github.sha }}" \
            "$(grep -oE '#define DA_RELAY_VERSION +[0-9]+' da_relay_proto.h | grep -oE '[0-9]+$')" > "$OUT/version.txt"

      - name: Upload relay artifact
        uses: actions/upload-artifact@v4
        with:
          name: directaudio-linux-relay
          path: out/relay
          retention-days: 30

  sink:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout this driver
        uses: actions/checkout@v4

      - name: PulseAudio 13.0 source (headers only)
        run: |
          set -euo pipefail
          curl -fsSL -o pa.tar.gz https://github.com/pulseaudio/pulseaudio/archive/refs/tags/v13.0.tar.gz
          mkdir -p pa13 && tar -xzf pa.tar.gz -C pa13 --strip-components=1 && rm pa.tar.gz

      - name: The daemon libraries the module links against (DroidDeck's PulseAudio 13 bundle, arm64)
        run: |
          set -euo pipefail
          mkdir -p palibs
          for lib in libpulsecore-13.0.so libpulsecommon-13.0.so libpulse.so; do
            curl -fsSL -o "palibs/$lib" "https://raw.githubusercontent.com/Droid-Deck/DroidDeck/main/app/src/main/jniLibs/arm64-v8a/$lib"
          done
          ls -la palibs; file palibs/*

      - name: Build module-directaudio-sink.so
        run: |
          set -euo pipefail
          export NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-$ANDROID_NDK_ROOT}}"
          pulse/build.sh "$PWD/pa13" "$PWD/palibs" "$PWD/out/sink"
          printf 'module-directaudio-sink (PulseAudio 13, Android arm64)\nsource %s\nprotocol v%s\n' "${{ github.sha }}" \
            "$(grep -oE '#define DA_RELAY_VERSION +[0-9]+' da_relay_proto.h | grep -oE '[0-9]+$')" > out/sink/version.txt

      - name: Upload sink artifact
        uses: actions/upload-artifact@v4
        with:
          name: directaudio-linux-sink
          path: out/sink
          retention-days: 30

  release:
    needs: [ unixlib, relay, sink ]
    if: startsWith(github.ref, 'refs/tags/directaudio-linux-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Stage zips
        run: |
          set -e
          mkdir -p release
          for d in artifacts/directaudio-linux-*; do
            n=$(basename "$d")
            (cd "$d" && zip -qr "$GITHUB_WORKSPACE/release/${n}.zip" .)
          done
          (cd release && sha256sum *.zip > SHA256SUMS.txt)
          ls -la release
      - name: Attach to release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*
          body: |
            **DirectAudio for the Linux Steam client** - the relay build (DroidDeck, Bannerlator's Linux session).

            One driver set per Wine audio interface - **pick by the Proton's `dlls/mmdevapi/unixlib.h`, not by its version number**; a mismatch is silence, not an error:
            - `directaudio-linux-wine11.zip` - Valve **Proton 11.0**, **Proton Experimental**, bleeding-edge and **GE-Proton 11.x** (ValveSoftware/wine `proton_11.0`). Complete 3-file set laid out for `lib/wine/`.
            - `directaudio-linux-wine11-systhread.zip` - **Proton-CachyOS** 11.0-20260703 / 20261005 and any Wine with the system-thread mmdevapi (`main_loop_start`, no `timer_loop`). Same layout.
            - `directaudio-linux-relay.zip` - `directaudio-relay` (also as `libdirectaudiorelay.so`), the Android-side helper that owns the AAudio output and microphone streams. One binary for every set.
            - `directaudio-linux-sink.zip` - `module-directaudio-sink.so`, the PulseAudio 13 sink that lets the Steam client's own sound share the relay's stream.

            Quick test for which set a Proton needs: `nm -D --undefined-only files/lib/wine/aarch64-unix/winepulse.so | grep -c PsCreateSystemThread` - `1` means system-thread, `0` means plain Wine 11.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
