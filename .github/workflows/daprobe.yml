name: build daprobe (audio capability probe)

# The guest-side capability probe (tools/daprobe). Its own workflow so a change to
# the tool does not rebuild the driver and a red X means exactly one thing. It links
# no Wine tree, so it cannot break the driver build either way.

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/daprobe/**'
      - '.github/workflows/daprobe.yml'
  pull_request:
    paths:
      - 'tools/daprobe/**'
  workflow_dispatch:

jobs:
  daprobe:
    # The capability probe (tools/daprobe) is an independent guest-side EXE, not part
    # of the driver, so it builds in its own job with no Wine tree involved. x86_64 PE
    # deliberately: it then runs in ANY container (arm64ec via FEX, or x86_64 directly),
    # and nothing about a capability query is performance-sensitive.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Cache LLVM MinGW toolchain
        id: cache-llvm-mingw-probe
        uses: actions/cache@v4
        with:
          path: ~/toolchains/llvm-mingw-20250920-ucrt-ubuntu-22.04-x86_64
          key: bylaws-llvm-mingw-20250920

      - name: Set up LLVM MinGW toolchain
        if: steps.cache-llvm-mingw-probe.outputs.cache-hit != 'true'
        run: |
          mkdir -p $HOME/toolchains && cd $HOME/toolchains
          wget -q https://github.com/bylaws/llvm-mingw/releases/download/20250920/llvm-mingw-20250920-ucrt-ubuntu-22.04-x86_64.tar.xz
          tar -xf llvm-mingw-20250920-ucrt-ubuntu-22.04-x86_64.tar.xz

      - name: Build daprobe.exe
        run: |
          set -e
          export PATH="$HOME/toolchains/llvm-mingw-20250920-ucrt-ubuntu-22.04-x86_64/bin:$PATH"
          mkdir -p out
          x86_64-w64-mingw32-clang tools/daprobe/daprobe.c -o out/daprobe.exe \
            -O2 -Wall -Wextra -Wno-unused-parameter \
            -lole32 -loleaut32 -luuid
          ls -la out/daprobe.exe
          file out/daprobe.exe

      - name: Upload daprobe
        uses: actions/upload-artifact@v4
        with:
          name: daprobe
          path: out/daprobe.exe
          retention-days: 30
